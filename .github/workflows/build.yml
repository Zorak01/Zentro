name: Build Zentro
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Check and package
        shell: pwsh
        run: ./build.ps1 -Publish
      - uses: actions/upload-artifact@v4
        with:
          name: Zentro-Windows-x64
          path: artifacts/Zentro/Zentro.exe
